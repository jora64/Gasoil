<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carburant moins cher</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171a;--mu:#6b7280;--ac:#16a34a;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#1a1e22;--tx:#f1f3f5;--mu:#9aa3ad;--ac:#4ade80;--bd:#2a3037}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 12px}
.row{display:flex;gap:8px;margin-bottom:12px}
select,button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button{background:var(--ac);color:#000;border:0;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:inherit}
.card:first-of-type{border-color:var(--ac)}
.p{font-size:20px;font-weight:700;color:var(--ac);white-space:nowrap}
.m{color:var(--mu);font-size:13px}
#s{color:var(--mu);margin:8px 0}
</style>
</head>
<body>
<h1>⛽ Carburant le moins cher</h1>
<div class="row">
<select id="f">
<option value="gazole">Gazole</option>
<option value="e10">SP95-E10</option>
<option value="sp98">SP98</option>
<option value="sp95">SP95</option>
<option value="e85">E85</option>
<option value="gplc">GPLc</option>
</select>
<select id="r">
<option value="5">5 km</option>
<option value="10" selected>10 km</option>
<option value="20">20 km</option>
<option value="40">40 km</option>
</select>
</div>
<div class="row"><button id="go">Autour de moi</button></div>
<div id="s"></div>
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
const API="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";
function km(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,
dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;
return 2*R*Math.asin(Math.sqrt(h))}
async function search(lat,lon){
  const f=$("f").value,r=$("r").value;
  $("s").textContent="Recherche…";$("out").innerHTML="";
  const where=`within_distance(geom, geom'POINT(${lon} ${lat})', ${r}km) AND ${f}_prix IS NOT NULL`;
  const u=`${API}?where=${encodeURIComponent(where)}&order_by=${f}_prix&limit=20`;
  try{
    const j=await (await fetch(u)).json();
    const rows=j.results||[];
    if(!rows.length){$("s").textContent="Aucune station trouvée.";return}
    $("s").textContent=rows.length+" stations, de la moins chère à la plus chère";
    $("out").innerHTML=rows.map(x=>{
      const d=km(lat,lon,x.geom.lat,x.geom.lon).toFixed(1);
      const maj=(x[f+"_maj"]||"").slice(0,10);
      return `<a class="card" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${x.geom.lat},${x.geom.lon}">
      <div><b>${x.ville}</b><div class="m">${x.adresse} · ${d} km</div><div class="m">maj ${maj}</div></div>
      <div class="p">${x[f+"_prix"].toFixed(3)} €</div></a>`}).join("");
  }catch(e){$("s").textContent="Erreur de chargement des prix."}
}
$("go").onclick=()=>{
  $("s").textContent="Localisation…";
  navigator.geolocation.getCurrentPosition(
    p=>search(p.coords.latitude,p.coords.longitude),
    ()=>{$("s").textContent="Localisation refusée."},
    {enableHighAccuracy:true,timeout:10000});
};
</script>
</body>
</html>
