<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f97316"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Carburant le moins cher</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171a;--mu:#6b7280;--ac:#16a34a;--bd:#e5e7eb;--wa:#d97706;--er:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--card:#1a1e22;--tx:#f1f3f5;--mu:#9aa3ad;--ac:#4ade80;--bd:#2a3037;--wa:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:14px;max-width:560px}
h1{font-size:20px;margin:2px 0 12px}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
input,select,button{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button{background:var(--ac);color:#000;border:0;font-weight:600}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.qk{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.qk button{flex:none;padding:9px 14px;font-size:14px;border-radius:99px;white-space:nowrap}
.qk #go{background:var(--ac);color:#000;border:0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:6px 0 12px}
.panel .row:last-child{margin-bottom:0}
.rg{margin:2px 0 10px}
input[type=range]{padding:0;border:0;background:none;width:100%;height:32px}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tg{position:relative}
.tg input{position:absolute;opacity:0;width:1px;height:1px;padding:0}
.tg span{display:inline-block;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);font-size:14px;color:var(--mu)}
.tg input:checked+span{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
input[type=number]{flex:none;width:90px;padding:8px 10px}
.m{color:var(--mu);font-size:13px}
#s{color:var(--mu);margin:6px 2px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card.best{border:2px solid var(--ac)}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nm{min-width:0}
.nm b{font-size:17px;line-height:1.25;display:block;word-break:break-word}
.pr{text-align:right;flex:none}
.p{font-size:24px;font-weight:800;color:var(--ac);white-space:nowrap;line-height:1.1}
.p.x{color:var(--er);font-size:18px}
.best-t{font-size:12px;font-weight:700;color:var(--ac);margin-top:2px}
.dl{font-size:12px;font-weight:600;color:var(--wa);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.chip.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.wa{border-color:var(--wa);color:var(--wa)}
.chip.er{border-color:var(--er);color:var(--er)}
a.go{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--ac);text-decoration:none}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on{background:var(--ac);color:#000;border-color:var(--ac)}
.act{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.act a.go{margin-top:0}
.star{flex:none;padding:6px 12px;font-size:13px;border-radius:99px;background:var(--card);color:var(--mu);border:1px solid var(--bd);font-weight:600}
.star.on{background:var(--wa);color:#000;border-color:var(--wa)}
.empty{color:var(--mu);text-align:center;padding:30px 10px;line-height:1.5}
.sec{font-weight:700;margin:14px 2px 8px}
#n{color:var(--mu);margin:14px 2px;font-size:12px}
.sug{display:block;width:100%;text-align:left;margin-bottom:6px}
</style>
</head>
<body>
<h1>⛽ Carburant le moins cher</h1>
<div class="tabs"><button class="tab on" id="t1">🔍 Recherche</button><button class="tab" id="t2">⭐ Favoris <span id="fc"></span></button></div>
<div id="vs">
<div class="row"><input id="c" placeholder="Ville ou code postal (France / Espagne)" enterkeyhint="search"><button id="q" style="flex:none">Chercher</button></div>
<div class="qk" id="qk"><button id="go">📍 Autour de moi</button></div>
<div class="row"><select id="vl"></select></div>
<div id="sug"></div>
</div>
<div class="panel">
<div class="row"><select id="f"></select><select id="so"><option value="p">Tri : prix</option><option value="d">Tri : distance</option></select></div>
<div id="vr"><div class="rg"><div class="m" id="rl">Rayon : 10 km</div><input type="range" id="r" min="1" max="50" step="1" value="10"></div>
<div class="tgs">
<label class="tg"><input type="checkbox" id="es"><span>🇪🇸 Espagne</span></label>
<label class="tg"><input type="checkbox" id="rup"><span>⛔ Ruptures</span></label>
<label class="tg"><input type="checkbox" id="cb"><span>💳 Automate CB</span></label>
</div></div>
<div class="row"><span class="m">Plein de</span><input type="number" id="lt" value="40" min="0" max="200" inputmode="numeric"><span class="m">litres (pour calculer le coût)</span></div>
</div>
<div id="s"></div>
<div id="out"></div>
<div id="n">Paiement : les données officielles n'indiquent pas si la station accepte les espèces ou la carte en caisse. Seule la présence d'un automate CB 24/24 est connue.</div>
<script>
const $=id=>document.getElementById(id);
const FUELS=[["gazole","Gazole"],["e10","SP95-E10"],["sp98","SP98"],["sp95","SP95"],["e85","E85"],["gplc","GPLc"]];
$("f").innerHTML=FUELS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
const API="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";
const ESAPI="https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2=n=>n.toFixed(2).replace(".",","),f3=n=>n.toFixed(3).replace(".",",");
const norm=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const cap=t=>String(t||"").toLowerCase().replace(/(^|[\s\-(.])\S/g,m=>m.toUpperCase());
const num=v=>{const n=parseFloat(String(v||"").replace(",","."));return isNaN(n)?null:n};
let pos=null,last=null,ES=null,lastFav=null,tab=1,FAV=[];
try{FAV=JSON.parse(localStorage.getItem("fav")||"[]")}catch(e){}
const REG={};
const saveFav=()=>{try{localStorage.setItem("fav",JSON.stringify(FAV))}catch(e){}};
const isFav=k=>FAV.some(f=>f.k==k);
const updFc=()=>{$("fc").textContent=FAV.length?"("+FAV.length+")":""};
const keyOf=it=>{const x=it.x,la=it.fr?x.geom.lat:x.lat,lo=it.fr?x.geom.lon:x.lon;return (it.fr?"f":"e")+(x.id??(la+","+lo))};
function km(a,b,c,d){const t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),
h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
const svc=x=>{const v=x.services_service;return (Array.isArray(v)?v:String(v||"").split("//")).join("|").toLowerCase()};
async function fetchRows(where,order,limit){
  const u=`${API}?where=${encodeURIComponent(where)}${order?"&order_by="+order:""}&limit=${limit}`;
  const j=await (await fetch(u)).json();return j.results||[];
}
async function loadES(){
  if(ES)return ES;
  const res=[await fetch(ESAPI,{headers:{Accept:"application/json"}}).then(r=>r.json())];
  ES=res.flatMap(j=>j.ListaEESSPrecio||[]).map(o=>({lat:num(o["Latitud"]),lon:num(o["Longitud (WGS84)"]),
    id:o["IDEESS"],ville:o["Municipio"]||o["Localidad"],loc:o["Localidad"],adresse:o["Dirección"],nom:o["Rótulo"],hor:o["Horario"],
    prices:{gazole:num(o["Precio Gasoleo A"]),e10:num(o["Precio Gasolina 95 E10"]),sp95:num(o["Precio Gasolina 95 E5"]),
      sp98:num(o["Precio Gasolina 98 E5"]),gplc:num(o["Precio Gases licuados del petróleo"]),e85:num(o["Precio Bioetanol"])??num(o["Precio Gasolina 95 E85"])}})).filter(x=>x.lat!=null&&x.lon!=null);
  return ES;
}
function itemOf(x,f,lat,lon){return {fr:1,x,p:x[f+"_prix"],d:km(lat,lon,x.geom.lat,x.geom.lon)}}
async function search(){
  if(!pos)return;
  const f=$("f").value,r=+$("r").value,{lat,lon}=pos;
  $("s").textContent="Recherche…";$("out").innerHTML="";
  const near=`within_distance(geom, geom'POINT(${lon} ${lat})', ${r}km)`;
  try{
    let rows=await fetchRows(`${near} AND ${f}_prix IS NOT NULL`,`${f}_prix`,40);
    let rup=$("rup").checked?await fetchRows(`${near} AND ${f}_rupture_type IS NOT NULL AND ${f}_prix IS NULL`,"",20):[];
    const cb=$("cb").checked;
    if(cb){rows=rows.filter(x=>svc(x).includes("automate cb"));rup=rup.filter(x=>svc(x).includes("automate cb"))}
    let items=rows.map(x=>itemOf(x,f,lat,lon)),note="";
    if($("es").checked&&!cb){
      if(!ES)$("s").textContent="Chargement des prix espagnols (première fois, quelques Mo)…";
      try{(await loadES()).forEach(x=>{const d=km(lat,lon,x.lat,x.lon);if(d<=r&&x.prices[f]!=null)items.push({fr:0,x,p:x.prices[f],d})})}
      catch(e){note=" · prix espagnols indisponibles"}
    }
    items.sort((a,b)=>a.p-b.p);
    last={items:items.slice(0,40),rup:rup.map(x=>itemOf(x,f,lat,lon)),f,r,note};
    render();
  }catch(e){$("s").textContent="Erreur de chargement des prix."}
}
function render(){
  if(!last)return;
  const {items,rup,f,r,note}=last,L=+$("lt").value||0;
  if(!items.length&&!rup.length){$("s").textContent="Aucune station trouvée."+note;$("out").innerHTML="";return}
  const min=items.length?Math.min(...items.map(i=>i.p)):0;
  const list=items.slice();if($("so").value=="d")list.sort((a,b)=>a.d-b.d);
  $("s").textContent=`${items.length} stations · ${FUELS.find(a=>a[0]==f)[1]} · rayon ${r} km`+(rup.length?` · ${rup.length} en rupture`:"")+note;
  $("out").innerHTML=list.map(i=>cardHTML(i,f,min,L)).join("")+(rup.length?`<div class="sec">⛔ En rupture de ${FUELS.find(a=>a[0]==f)[1]}</div>`+rup.map(i=>cardHTML(i,f,min,L)).join(""):"");
}
function cardHTML(it,f,min,L){
  const x=it.x,p=it.p,d=it.d==null?"":it.d.toFixed(1).replace(".",",");
  let title,sub,addr,chips="",fuels="",la,lo;
  if(it.fr){
    const maj=(x[f+"_maj"]||"").slice(0,10),s=svc(x),rt=x[f+"_rupture_type"],rd=(x[f+"_rupture_debut"]||"").slice(0,10);
    title="🇫🇷 "+esc(x.ville);sub=(d?`📍 ${d} km`:"")+(maj?(d?" · ":"")+`prix du ${esc(maj)}`:"");addr=esc(x.adresse);la=x.geom.lat;lo=x.geom.lon;
    chips=(rt?`<span class="chip er">⛔ Rupture ${esc(rt)}${rd?" depuis "+esc(rd):""}</span>`:`<span class="chip on">✅ En stock</span>`)
      +(s.includes("automate cb")?'<span class="chip">💳 Automate CB 24/24</span>':"")
      +(x.horaires_automate_24_24==="Oui"?'<span class="chip">🕒 Ouvert 24h/24</span>':"");
    fuels=FUELS.filter(([k])=>x[k+"_prix"]!=null).map(([k,n])=>`<span class="chip${k==f?" on":""}">${n} ${f3(x[k+"_prix"])} €</span>`).join("")
      +FUELS.filter(([k])=>x[k+"_rupture_type"]&&k!=f).map(([k,n])=>`<span class="chip wa">${n} en rupture</span>`).join("");
  }else{
    const lt=x.loc&&norm(x.loc)!=norm(x.ville)?" ("+cap(x.loc)+")":"";
    title="🇪🇸 "+esc(cap(x.nom)||x.ville);sub=`📍 ${esc(x.ville)}${esc(lt)}`+(d?` · ${d} km`:"");addr=esc(cap(x.adresse));la=x.lat;lo=x.lon;
    chips=x.hor?`<span class="chip">🕒 ${esc(x.hor)}</span>`:"";
    fuels=FUELS.filter(([k])=>x.prices[k]!=null).map(([k,n])=>`<span class="chip${k==f?" on":""}">${n} ${f3(x.prices[k])} €</span>`).join("");
  }
  const k=keyOf(it);REG[k]={k,fr:it.fr,id:x.id,t:it.fr?x.ville:(cap(x.nom)||x.ville),la,lo};
  let pr,best="";
  if(p==null)pr='<div class="p x">—</div>';
  else{
    const isBest=p-min<0.0005;if(isBest)best=" best";
    pr=`<div class="p">${f3(p)} €</div>`;
    if(L>0)pr+=`<div class="m">Plein ${L} L : ${f2(p*L)} €</div>`;
    pr+=isBest?'<div class="best-t">Meilleur prix</div>':`<div class="dl">+${L>0?f2((p-min)*L)+" € sur le plein":f3(p-min)+" €/L"}</div>`;
  }
  return `<div class="card${best}"><div class="hd"><div class="nm"><b>${title}</b><div class="m">${sub}</div><div class="m">${addr}</div></div><div class="pr">${pr}</div></div>
  <div class="chips">${chips}</div><div class="chips">${fuels}</div>
  <div class="act"><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${la},${lo}">Itinéraire →</a><button class="star${isFav(k)?" on":""}" data-k="${esc(k)}">${isFav(k)?"★ Favori":"☆ Favori"}</button></div></div>`;
}
function toggleFav(k){
  const i=FAV.findIndex(f=>f.k==k);
  if(i>=0)FAV.splice(i,1);else if(REG[k])FAV.push(REG[k]);
  saveFav();updFc();
  if(tab==2&&lastFav){lastFav.ok=lastFav.ok.filter(r=>isFav(keyOf(r)));lastFav.miss=lastFav.miss.filter(m=>isFav(m.k));renderFav()}
  else render();
}
function renderFav(){
  if(!lastFav)return;
  const {ok,miss,f}=lastFav,L=+$("lt").value||0;
  if(!FAV.length){$("s").textContent="";$("out").innerHTML=`<div class="empty">⭐ Aucun favori pour l'instant.<br>Fais une recherche, puis touche « ☆ Favori » sur une station.</div>`;return}
  const priced=ok.filter(r=>r.p!=null),min=priced.length?Math.min(...priced.map(r=>r.p)):0;
  $("s").textContent=`${FAV.length} favori${FAV.length>1?"s":""} · ${FUELS.find(a=>a[0]==f)[1]}`;
  $("out").innerHTML=ok.map(r=>cardHTML(r,f,min,L)).join("")+miss.map(m=>`<div class="card"><div class="hd"><div class="nm"><b>${esc(m.t)}</b><div class="m">Prix indisponibles pour l'instant</div></div></div><div class="act"><span></span><button class="star on" data-k="${esc(m.k)}">★ Favori</button></div></div>`).join("");
}
async function showFavs(){
  const f=$("f").value;
  if(!FAV.length){lastFav={ok:[],miss:[],f};renderFav();return}
  $("s").textContent="Mise à jour des favoris…";$("out").innerHTML="";
  const res=await Promise.all(FAV.map(async fv=>{
    try{
      let x;
      if(fv.fr){
        const rows=await fetchRows(`within_distance(geom, geom'POINT(${fv.lo} ${fv.la})', 0.3km)`,"",5);
        x=rows.find(r=>String(r.id)==String(fv.id))||rows[0];
        if(!x)return {miss:fv};
        return {fr:1,x,p:x[f+"_prix"],d:pos?km(pos.lat,pos.lon,x.geom.lat,x.geom.lon):null};
      }
      const es=await loadES();
      x=es.find(e=>String(e.id)==String(fv.id))||es.find(e=>km(fv.la,fv.lo,e.lat,e.lon)<0.3);
      if(!x)return {miss:fv};
      return {fr:0,x,p:x.prices[f],d:pos?km(pos.lat,pos.lon,x.lat,x.lon):null};
    }catch(e){return {miss:fv}}
  }));
  if(tab!=2)return;
  lastFav={ok:res.filter(r=>!r.miss).sort((a,b)=>(a.p??9e9)-(b.p??9e9)),miss:res.filter(r=>r.miss).map(r=>r.miss),f};
  renderFav();
}
function setTab(n){
  tab=n;$("t1").classList.toggle("on",n==1);$("t2").classList.toggle("on",n==2);
  const d=n==1?"":"none";$("vs").style.display=d;$("vr").style.display=d;$("so").style.display=d;
  if(n==1){$("out").innerHTML="";$("s").textContent="";render()}else showFavs();
}
const CITIES=[
["fr","Hendaye",43.359,-1.774],["fr","Saint-Jean-de-Luz",43.388,-1.662],["fr","Biarritz",43.483,-1.558],["fr","Bayonne",43.493,-1.475],["fr","Saint-Jean-Pied-de-Port",43.164,-1.237],["fr","Pau",43.295,-0.371],["fr","Lourdes",43.095,-0.046],["fr","Tarbes",43.233,0.073],["fr","Saint-Gaudens",43.108,0.724],["fr","Foix",42.965,1.607],["fr","Bourg-Madame",42.433,1.947],["fr","Perpignan",42.699,2.895],["fr","Le Boulou",42.525,2.833],["fr","Céret",42.487,2.749],["fr","Argelès-sur-Mer",42.546,3.022],["fr","Cerbère",42.442,3.168],["fr","Bordeaux",44.838,-0.579],["fr","Toulouse",43.604,1.444],["fr","Montpellier",43.611,3.877],["fr","Marseille",43.296,5.370],["fr","Lyon",45.764,4.836],["fr","Paris",48.857,2.352],
["es","Irun",43.339,-1.789],["es","Hondarribia",43.368,-1.791],["es","Bera",43.283,-1.685],["es","Dancharia",43.266,-1.533,"dantcharia dancharinea dantxarinea"],["es","Behobia (Béhobie)",43.356,-1.766,"behobie"],["es","Elizondo",43.146,-1.520],["es","San Sebastián (Donostia)",43.318,-1.981],["es","Pamplona",42.812,-1.645],["es","Bilbao",43.263,-2.935],["es","Vitoria-Gasteiz",42.846,-2.673],["es","Logroño",42.466,-2.446],["es","Canfranc",42.703,-0.517],["es","Jaca",42.570,-0.549],["es","Huesca",42.140,-0.408],["es","Zaragoza",41.649,-0.889],["es","Vielha",42.703,0.795],["es","Lleida",41.617,0.620],["es","Puigcerdà",42.432,1.929],["es","La Jonquera",42.419,2.875],["es","Figueres",42.267,2.961],["es","Portbou",42.428,3.158],["es","Girona",41.983,2.824],["es","Barcelona",41.385,2.173],["es","Madrid",40.417,-3.704],["es","Valencia",39.470,-0.376]];
const flag=c=>c=="fr"?"🇫🇷":"🇪🇸";
(()=>{const g=c=>CITIES.map((x,i)=>x[0]==c?`<option value="${i}">${x[1]}</option>`:"").join("");
$("vl").innerHTML=`<option value="">Plus de villes…</option><optgroup label="🇫🇷 France">${g("fr")}</optgroup><optgroup label="🇪🇸 Espagne">${g("es")}</optgroup>`})();
const QUICK=["Irun","Behobia (Béhobie)","Dancharia","Hendaye"];
$("qk").insertAdjacentHTML("beforeend",QUICK.map(n=>{const i=CITIES.findIndex(c=>c[1]==n);return `<button class="alt" data-i="${i}">${flag(CITIES[i][0])} ${n}</button>`}).join(""));
$("qk").onclick=e=>{const c=CITIES[e.target.dataset.i];if(c)pick({n:c[1],lat:c[2],lon:c[3],es:c[0]=="es"})};
$("vl").onchange=e=>{const c=CITIES[e.target.value];if(c)pick({n:c[1],lat:c[2],lon:c[3],es:c[0]=="es"})};
async function city(){
  const v=$("c").value.trim();if(!v)return;
  $("s").textContent="Recherche de la ville…";$("sug").innerHTML="";
  const cp=/^\d{5}$/.test(v);
  const fr=fetch(`https://geo.api.gouv.fr/communes?${cp?"codePostal="+v:"nom="+encodeURIComponent(v)}&fields=nom,centre,departement&boost=population&limit=4`).then(r=>r.json()).catch(()=>[]);
  const es=fetch(`https://nominatim.openstreetmap.org/search?${cp?"postalcode="+v:"q="+encodeURIComponent(v)}&countrycodes=es&featuretype=settlement&format=jsonv2&addressdetails=1&accept-language=fr&limit=4`).then(r=>r.json()).catch(()=>[]);
  const [a,b]=await Promise.all([fr,es]);
  const on=[...a.map(c=>({t:`🇫🇷 ${c.nom} (${c.departement?.code||""})`,n:c.nom,lat:c.centre.coordinates[1],lon:c.centre.coordinates[0],es:false})),
    ...b.map(c=>{const n=c.name||c.display_name.split(",")[0];return {t:`🇪🇸 ${n} (${c.address?.province||c.address?.state||""})`,n,lat:+c.lat,lon:+c.lon,es:true}})];
  const local=CITIES.filter(x=>norm(x[1]+" "+(x[4]||"")).includes(norm(v))).map(x=>({t:`${flag(x[0])} ${x[1]}`,n:x[1],lat:x[2],lon:x[3],es:x[0]=="es"}));
  const k=c=>(c.es?"e":"f")+norm(c.n);const seen=new Set(local.map(k));
  const o=[...local,...on.filter(c=>!seen.has(k(c)))];
  if(!o.length){$("s").textContent="Ville introuvable.";return}
  if(o.length==1)return pick(o[0]);
  $("s").textContent="Quelle ville ?";
  $("sug").innerHTML=o.map((c,i)=>`<button class="alt sug" data-i="${i}">${esc(c.t)}</button>`).join("");
  $("sug").onclick=e=>{const i=e.target.dataset.i;if(i!=null)pick(o[i])};
}
function pick(c){$("sug").innerHTML="";$("c").value=c.n;if(c.es)$("es").checked=true;pos={lat:c.lat,lon:c.lon};search()}
$("q").onclick=city;
$("c").onkeydown=e=>{if(e.key==="Enter")city()};
$("go").onclick=()=>{
  $("s").textContent="Localisation…";
  navigator.geolocation.getCurrentPosition(p=>{$("c").value="";pos={lat:p.coords.latitude,lon:p.coords.longitude};search()},
  ()=>{$("s").textContent="Localisation refusée."},{enableHighAccuracy:true,timeout:10000});
};
$("r").oninput=()=>{$("rl").textContent="Rayon : "+$("r").value+" km"};
["r","rup","cb","es"].forEach(id=>$(id).onchange=search);
$("f").onchange=()=>tab==2?showFavs():search();
$("t1").onclick=()=>setTab(1);$("t2").onclick=()=>setTab(2);
$("out").onclick=e=>{const b=e.target.closest&&e.target.closest(".star");if(b)toggleFav(b.dataset.k)};
updFc();
$("so").onchange=render;$("lt").oninput=()=>tab==2?renderFav():render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
